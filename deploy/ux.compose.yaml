services:
  ux:
    build:
      context: ..
      dockerfile: deploy/ux.Dockerfile
    env_file: ../.env.ux
    environment:
      UX_BIND_HOST: 0.0.0.0
      UX_PORT: 8081
    ports: ["127.0.0.1:8081:8081"]
    volumes: ["ux-data:/opt/cardgame/data-ux"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
volumes:
  ux-data:
