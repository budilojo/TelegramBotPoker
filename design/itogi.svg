<?xml version="1.0" encoding="UTF-8"?>
<!--
  Итоги партии, 360×780 — экран телефона, в котором живёт игра.

  Собрано генератором tools/make-design.mjs по макету владельца. Группы
  названы по-русски, текст настоящий, цвета из docs/design.md. Перетащите в
  Figma — откроется слоями.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs>
